name: plan_my_party
description: Plan My Party customer experience rebuilt with native Flutter widgets.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: '>=3.35.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  intl: ^0.20.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/dm-sans.ttf
          weight: 400
        - asset: assets/fonts/dm-sans.ttf
          weight: 500
        - asset: assets/fonts/dm-sans.ttf
          weight: 600
        - asset: assets/fonts/dm-sans.ttf
          weight: 700
        - asset: assets/fonts/dm-sans.ttf
          weight: 800
